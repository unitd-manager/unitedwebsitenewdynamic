<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark 3D supplier management network</title>
  <desc id="desc">A dark supply chain control panel with connected supplier nodes, route lines, and warehouse cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021018"/><stop offset=".6" stop-color="#062434"/><stop offset="1" stop-color="#00070b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#103346"/><stop offset="1" stop-color="#03111a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5af7ff"/><stop offset="1" stop-color="#147cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M70 520c235-220 420-290 620-215s294-14 430-172" fill="none" stroke="#28eaff" stroke-opacity=".12" stroke-width="80"/>
