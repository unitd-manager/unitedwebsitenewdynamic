    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".8" filter="url(#glow)">
      <path d="M212 285L390 170L572 255L682 145"/>
      <path d="M212 285L430 355L572 255"/>
    </g>
    <g fill="#06151e" stroke="#4cecff" stroke-opacity=".45" stroke-width="5">
      <circle cx="212" cy="285" r="48"/><circle cx="390" cy="170" r="48"/><circle cx="572" cy="255" r="48"/><circle cx="682" cy="145" r="48"/><circle cx="430" cy="355" r="48"/>
    </g>
    <g fill="url(#accent)">
      <path d="M190 300h44v18h-44zM197 275h30v18h-30z"/>
      <path d="M368 185h44v18h-44zM375 160h30v18h-30z"/>
      <path d="M550 270h44v18h-44zM557 245h30v18h-30z"/>
      <path d="M660 160h44v18h-44zM667 135h30v18h-30z"/>
      <path d="M408 370h44v18h-44zM415 345h30v18h-30z"/>
