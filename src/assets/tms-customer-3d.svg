<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark 3D customer management profiles</title>
  <desc id="desc">A dark CRM-style customer management screen with floating profile cards and relationship data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021019"/><stop offset=".6" stop-color="#062332"/><stop offset="1" stop-color="#01070c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123548"/><stop offset="1" stop-color="#04131c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63f7ff"/><stop offset="1" stop-color="#0b7cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(175 120)">
    <rect width="850" height="410" rx="34" fill="url(#panel)" stroke="#3deaff" stroke-opacity=".2"/>
    <g transform="translate(70 72)">
      <rect width="245" height="260" rx="28" fill="#061720" stroke="#42eaff" stroke-opacity=".18"/>
      <circle cx="122" cy="82" r="46" fill="url(#accent)" filter="url(#glow)"/>
      <path d="M58 190c20-42 108-42 128 0" fill="none" stroke="#79f8ff" stroke-width="18" stroke-linecap="round" opacity=".65"/>
      <rect x="48" y="220" width="150" height="16" rx="8" fill="#91f8ff" opacity=".22"/>
    </g>
    <g transform="translate(350 60)">
      <rect width="430" height="78" rx="22" fill="#071a24"/>
      <rect x="28" y="26" width="210" height="16" rx="8" fill="#75f6ff" opacity=".75"/>
      <rect x="278" y="22" width="100" height="34" rx="17" fill="url(#accent)"/>
      <rect y="112" width="430" height="78" rx="22" fill="#071a24"/>
      <rect x="28" y="138" width="250" height="16" rx="8" fill="#75f6ff" opacity=".42"/>
      <rect x="308" y="134" width="70" height="34" rx="17" fill="#0f4258"/>
      <rect y="224" width="430" height="78" rx="22" fill="#071a24"/>
      <rect x="28" y="250" width="188" height="16" rx="8" fill="#75f6ff" opacity=".42"/>
      <rect x="278" y="246" width="100" height="34" rx="17" fill="#0f4258"/>
    </g>
  </g>
</svg>
