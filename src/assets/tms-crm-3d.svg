<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark 3D CRM relationship management</title>
  <desc id="desc">A dark CRM interface with customer profile clusters, interaction timeline, and glowing relationship connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021019"/>
      <stop offset=".52" stop-color="#072637"/>
      <stop offset="1" stop-color="#01070c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12374b"/>
      <stop offset="1" stop-color="#04131c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67f8ff"/>
      <stop offset="1" stop-color="#0a7cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="250" cy="145" r="230" fill="#00d9ff" opacity=".07"/>
  <circle cx="975" cy="525" r="260" fill="#0b7cff" opacity=".08"/>
  <g transform="translate(165 95)">
    <rect width="870" height="455" rx="38" fill="url(#panel)" stroke="#35eaff" stroke-opacity=".2"/>
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".72" filter="url(#glow)">
      <path d="M230 205L430 130L635 220"/>
      <path d="M230 205L450 325L635 220"/>
      <path d="M430 130L450 325"/>
    </g>
    <g fill="#061720" stroke="#45eaff" stroke-opacity=".42" stroke-width="5">
      <circle cx="230" cy="205" r="72"/>
      <circle cx="430" cy="130" r="62"/>
      <circle cx="635" cy="220" r="72"/>
      <circle cx="450" cy="325" r="62"/>
    </g>
    <g fill="url(#accent)" filter="url(#glow)">
      <circle cx="230" cy="185" r="22"/>
      <path d="M188 240c16-36 68-36 84 0" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="430" cy="114" r="18"/>
      <path d="M396 164c13-29 55-29 68 0" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="635" cy="200" r="22"/>
      <path d="M593 255c16-36 68-36 84 0" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="450" cy="309" r="18"/>
      <path d="M416 359c13-29 55-29 68 0" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(95 340)">
      <rect width="260" height="54" rx="18" fill="#061720"/>
      <rect x="24" y="20" width="145" height="14" rx="7" fill="#8ff8ff" opacity=".34"/>
      <rect x="190" y="14" width="42" height="26" rx="13" fill="url(#accent)"/>
    </g>
    <g transform="translate(575 70)">
      <rect width="210" height="54" rx="18" fill="#061720"/>
      <rect x="22" y="20" width="112" height="14" rx="7" fill="#8ff8ff" opacity=".34"/>
      <path d="M160 33l14 14 30-38" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
