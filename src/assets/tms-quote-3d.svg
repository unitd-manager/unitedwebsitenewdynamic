<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark 3D quote management document</title>
  <desc id="desc">A floating digital quote document with pricing blocks, approvals, and cyan neon interface elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03131c"/><stop offset=".55" stop-color="#062637"/><stop offset="1" stop-color="#01080d"/></linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12384c"/><stop offset="1" stop-color="#05121a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66f7ff"/><stop offset="1" stop-color="#0b78ff"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".55"/><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00dfff" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
