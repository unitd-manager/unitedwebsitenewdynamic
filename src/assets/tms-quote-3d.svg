    <rect x="54" y="126" width="410" height="16" rx="8" fill="#a7f9ff" opacity=".24"/>
    <rect x="54" y="164" width="360" height="16" rx="8" fill="#a7f9ff" opacity=".16"/>
    <rect x="54" y="225" width="412" height="150" rx="24" fill="#06151e" stroke="#42eaff" stroke-opacity=".16"/>
    <path d="M96 330h70V270H96zm116 0h70v-92h-70zm116 0h70v-44h-70z" fill="url(#accent)"/>
    <rect x="54" y="414" width="178" height="42" rx="21" fill="#092838" stroke="#55eeff" stroke-opacity=".25"/>
    <path d="M330 438l28 28 72-84" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
