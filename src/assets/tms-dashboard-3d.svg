<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dark 3D trading dashboard reports</title>
  <desc id="desc">A dark analytics dashboard with glowing sales charts, report widgets, and performance metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021018"/><stop offset=".5" stop-color="#082637"/><stop offset="1" stop-color="#01070c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12384c"/><stop offset="1" stop-color="#04111a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61f8ff"/><stop offset="1" stop-color="#087cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(145 95) skewY(-5)">
    <rect width="910" height="465" rx="38" fill="url(#panel)" stroke="#39eaff" stroke-opacity=".2"/>
    <rect x="55" y="55" width="250" height="115" rx="26" fill="#061720"/>
    <rect x="340" y="55" width="250" height="115" rx="26" fill="#061720"/>
    <rect x="625" y="55" width="230" height="115" rx="26" fill="#061720"/>
    <g fill="url(#accent)" filter="url(#glow)">
      <path d="M91 131h34V94H91zm58 0h34V75h-34zm58 0h34v-58h-34z"/>
      <path d="M377 128l42-38 46 22 58-50" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M735 75a54 54 0 1 1-49 77l49-23z"/>
    </g>
    <rect x="55" y="215" width="510" height="190" rx="28" fill="#061720"/>
    <path d="M100 350c80-110 150-30 220-86 65-52 104-54 198 18" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
    <rect x="615" y="215" width="240" height="190" rx="28" fill="#061720"/>
    <rect x="652" y="258" width="150" height="15" rx="8" fill="#8ff8ff" opacity=".24"/>
    <rect x="652" y="304" width="115" height="15" rx="8" fill="#8ff8ff" opacity=".45"/>
